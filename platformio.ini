[platformio]
src_dir = firmware/vento8266
[env:d1_mini_simulazione]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200

[env:freenove_esp32_simulazione]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Prova dei soli relè ventole. Pompa, coil e valvole restano in simulazione.
[env:freenove_esp32_ventole]
extends = env:freenove_esp32_simulazione
build_flags = -DVENTO_ENABLE_FAN_RELAYS=1

; SOLO PROVA A BANCO: coil, valvole, pompe e ventole scollegate.
[env:freenove_esp32_sequenza_banco]
extends = env:freenove_esp32_ventole
build_flags = -DVENTO_ENABLE_FAN_RELAYS=1 -DVENTO_DRY_TEST_OUTPUTS=1

; Prova valvole, ventole e pompa: coil esclusa dalla sequenza.
[env:freenove_esp32_valvole]
extends = env:freenove_esp32_ventole
build_flags = -DVENTO_ENABLE_FAN_RELAYS=1 -DVENTO_ENABLE_VALVES=1
