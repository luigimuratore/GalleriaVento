<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1170" role="img" aria-labelledby="t d"><title id="t">VENTO — collegamenti indicativi ESP8266</title><desc id="d">Diagramma con pin della D1 mini, segnali di comando, driver e carichi. I collegamenti di potenza sono rappresentati separatamente e richiedono dimensionamento.</desc><defs><style>text{font-family:Arial,sans-serif}.title{font-size:31px;font-weight:bold;fill:#edf7ee}.sub{font-size:17px;fill:#b0c7b9}.label{font-size:19px;font-weight:bold;fill:#eef7ee}.sm{font-size:15px;fill:#b5c9bd}.pin{font-size:19px;font-weight:bold;fill:#bff99a}.box{fill:#192925;stroke:#526f5b;stroke-width:2}.driver{fill:#2e291e;stroke:#b59a63;stroke-width:2}.load{fill:#1a2c37;stroke:#638999;stroke-width:2}.warn{fill:#352820;stroke:#d6a171;stroke-width:2}.signal{fill:none;stroke:#bff99a;stroke-width:3}.power{fill:none;stroke:#f4bd6c;stroke-width:3}.ground{fill:none;stroke:#80a8e1;stroke-width:3}.cap{font-size:13px;letter-spacing:2px;font-weight:bold;fill:#a3c4ad}</style></defs><rect width="1400" height="1170" rx="20" fill="#0d1714"/><text x="45" y="53" class="cap">VENTO / BOZZA DI CIRCUITO</text><text x="45" y="96" class="title">ESP8266: pin, comandi e carichi</text><text x="45" y="127" class="sub">Schema indicativo • i blocchi di potenza non rappresentano ancora morsetti o componenti definitivi</text><text x="65" y="185" class="cap">1 · SCHEDA</text><text x="400" y="185" class="cap">2 · MODULI DI COMANDO</text><text x="885" y="185" class="cap">3 · DISPOSITIVI</text><rect x="45" y="205" width="270" height="645" rx="20" class="box"/><text x="70" y="245" class="label">D1 mini / ESP8266</text><text x="70" y="271" class="sm">Segnali a 3,3 V</text><rect x="70" y="294" width="100" height="65" rx="8" fill="#0e1815" stroke="#83a68a"/><path d="M79 311h20v-9h13v13h12v-13h13v18h21" fill="none" stroke="#ddb76d" stroke-width="3"/><text x="70" y="402" class="pin">D1</text><text x="133" y="402" class="sm">GPIO5</text><circle cx="300" cy="397" r="5" fill="#bff99a"/><path class="signal" d="M305 397 H395"/><rect x="395" y="373" width="430" height="48" rx="10" class="driver"/><text x="412" y="403" class="label">Driver + contattore motori</text><path class="signal" d="M825 397 H875"/><rect x="875" y="371" width="475" height="52" rx="10" class="load"/><text x="892" y="393" class="label">VENTOLE 230 V</text><text x="892" y="413" class="sm">Rete 230 V: sezione separata</text><text x="70" y="466" class="pin">D2</text><text x="133" y="466" class="sm">GPIO4</text><circle cx="300" cy="461" r="5" fill="#bff99a"/><path class="signal" d="M305 461 H395"/><rect x="395" y="437" width="430" height="48" rx="10" class="driver"/><text x="412" y="467" class="label">Driver MOSFET DC + protezione</text><path class="signal" d="M825 461 H875"/><rect x="875" y="435" width="475" height="52" rx="10" class="load"/><text x="892" y="457" class="label">POMPA FILETTI</text><text x="892" y="477" class="sm">12 V DC · ipotesi</text><text x="70" y="530" class="pin">D5</text><text x="133" y="530" class="sm">GPIO14</text><circle cx="300" cy="525" r="5" fill="#bff99a"/><path class="signal" d="M305 525 H395"/><rect x="395" y="501" width="430" height="48" rx="10" class="driver"/><text x="412" y="531" class="label">Driver dedicato + protezioni autonome</text><path class="signal" d="M825 525 H875"/><rect x="875" y="499" width="475" height="52" rx="10" class="load"/><text x="892" y="521" class="label">COIL / TRACCIANTE</text><text x="892" y="541" class="sm">Tensione e corrente DA DEFINIRE</text><text x="70" y="594" class="pin">D6</text><text x="133" y="594" class="sm">GPIO12</text><circle cx="300" cy="589" r="5" fill="#bff99a"/><path class="signal" d="M305 589 H395"/><rect x="395" y="565" width="430" height="48" rx="10" class="driver"/><text x="412" y="595" class="label">Driver MOSFET DC + protezione</text><path class="signal" d="M825 589 H875"/><rect x="875" y="563" width="475" height="52" rx="10" class="load"/><text x="892" y="585" class="label">VALVOLA SOPRA</text><text x="892" y="605" class="sm">12 V DC · ipotesi</text><text x="70" y="658" class="pin">D7</text><text x="133" y="658" class="sm">GPIO13</text><circle cx="300" cy="653" r="5" fill="#bff99a"/><path class="signal" d="M305 653 H395"/><rect x="395" y="629" width="430" height="48" rx="10" class="driver"/><text x="412" y="659" class="label">Driver MOSFET DC + protezione</text><path class="signal" d="M825 653 H875"/><rect x="875" y="627" width="475" height="52" rx="10" class="load"/><text x="892" y="649" class="label">VALVOLA SOTTO</text><text x="892" y="669" class="sm">12 V DC · ipotesi</text><text x="70" y="722" class="pin">D8</text><text x="133" y="722" class="sm">GPIO15</text><circle cx="300" cy="717" r="5" fill="#bff99a"/><path class="signal" d="M305 717 H395"/><rect x="395" y="693" width="430" height="48" rx="10" class="driver"/><text x="412" y="723" class="label">Driver / contattore adeguato</text><path class="signal" d="M825 717 H875"/><rect x="875" y="691" width="475" height="52" rx="10" class="load"/><text x="892" y="713" class="label">COMPRESSORE</text><text x="892" y="733" class="sm">Tensione DA DEFINIRE · attenzione boot</text><text x="70" y="786" class="pin">D0</text><text x="133" y="786" class="sm">GPIO16</text><circle cx="300" cy="781" r="5" fill="#bff99a"/><path class="signal" d="M305 781 H395"/><rect x="395" y="757" width="430" height="48" rx="10" class="driver"/><text x="412" y="787" class="label">Driver MOSFET DC</text><path class="signal" d="M825 781 H875"/><rect x="875" y="755" width="475" height="52" rx="10" class="load"/><text x="892" y="777" class="label">STRISCIA LED</text><text x="892" y="797" class="sm">12 V DC · ipotesi · solo ON/OFF</text><rect x="45" y="880" width="600" height="125" rx="14" class="box"/><text x="65" y="914" class="label">Alimentazione e riferimenti</text><text x="65" y="942" class="sm">ESP: 5 V regolati alla scheda, se compatibile con la revisione.</text><text x="65" y="967" class="sm">Carichi DC: alimentatore e fusibili per ogni ramo, da dimensionare.</text><text x="65" y="992" class="sm">GND comune solo per driver non isolati che lo richiedono.</text><rect x="665" y="880" width="685" height="125" rx="14" class="warn"/><text x="685" y="914" class="label">Protezione indipendente</text><text x="685" y="942" class="sm">Arresto fisico e catena di sicurezza disabilitano la potenza.</text><text x="685" y="967" class="sm">Coil: consenso di flusso + protezione termica indipendente.</text><text x="685" y="992" class="sm">D8 deve rimanere basso al boot; verificare il driver reale.</text><path class="signal" d="M65 1060h55"/><text x="130" y="1066" class="sm">Segnale di comando 3,3 V</text><path class="power" d="M430 1060h55"/><text x="495" y="1066" class="sm">Alimentazione</text><path class="ground" d="M690 1060h55"/><text x="755" y="1066" class="sm">GND (se richiesto)</text><text x="65" y="1110" class="sub">Il disegno mostra i segnali. Alimentazione, masse e protezioni sono trattate nel secondo disegno.</text><text x="65" y="1137" class="sm">Non collegare direttamente carichi ai GPIO. La rete 230 V richiede progetto e verifica qualificata.</text></svg>