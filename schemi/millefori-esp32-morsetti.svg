<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1570" role="img" aria-labelledby="title desc"><title id="title">Millefori ESP32 con MOSFET e morsetti verdi</title><desc id="desc">Mappa logica di otto morsetti doppi. Due moduli MOSFET montati sulla millefori sono collegati ai GPIO 26 e 27, le loro connessioni di potenza escono sui morsetti.</desc><style>text{font-family:Arial,sans-serif}.bg{fill:#101925}.title{fill:#fff;font-size:34px;font-weight:bold}.sub{fill:#c6d3df;font-size:18px}.label{fill:#d7ecff;font-size:20px;font-weight:bold}.txt{fill:#eff8f2;font-size:19px}.small{fill:#d2dce5;font-size:17px}.box{fill:#1b3448;stroke:#6999b8;stroke-width:2}.mos{fill:#263d64;stroke:#8fbbf6;stroke-width:2}.terminal{fill:#294936;stroke:#82ba8f;stroke-width:2}.wire{stroke:#90caff;stroke-width:3;fill:none}.warn{fill:#443729;stroke:#d3a76b;stroke-width:2}</style><rect width="1500" height="1570" rx="20" class="bg"/><text x="45" y="55" class="title">Millefori ESP32 · MOSFET montati sulla scheda</text><text x="45" y="88" class="sub">BOZZA PRECEDENTE: 16 poli da rivedere · non usare per il cablaggio definitivo</text><rect x="45" y="112" width="1410" height="65" rx="10" class="warn"/><text x="65" y="151" class="small">Solo bassa tensione sulla millefori. Verificare sigle, polarità, correnti e avvio sicuro prima di saldare.</text><rect x="45" y="215" width="335" height="500" rx="15" class="box"/><text x="65" y="248" class="label">ESP32-WROOM</text><text x="65" y="277" class="small">GPIO → morsetti / MOSFET</text><text x="630" y="230" class="label">MORSETTI ESTERNI</text>
<rect x="610" y="247" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="270" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 270h12" stroke="#344d39" stroke-width="2"/><text x="660" y="277" class="txt">01 · RELÈ A · IN1</text>
<text x="70" y="277" class="label">GPIO 25</text><path d="M365 270 H620" class="wire"/>
<circle cx="632" cy="324" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 324h12" stroke="#344d39" stroke-width="2"/><text x="660" y="331" class="txt">02 · RELÈ A · IN2</text>
<text x="70" y="331" class="label">GPIO 23</text><path d="M365 324 H620" class="wire"/>
<rect x="610" y="355" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="378" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 378h12" stroke="#344d39" stroke-width="2"/><text x="660" y="385" class="txt">03 · RELÈ B · IN1</text>
<text x="70" y="385" class="label">GPIO 21</text><path d="M365 378 H620" class="wire"/>
<circle cx="632" cy="432" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 432h12" stroke="#344d39" stroke-width="2"/><text x="660" y="439" class="txt">04 · RELÈ B · IN2</text>
<text x="70" y="439" class="label">GPIO 22</text><path d="M365 432 H620" class="wire"/>
<rect x="610" y="463" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="486" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 486h12" stroke="#344d39" stroke-width="2"/><text x="660" y="493" class="txt">05 · DRIVER VALVOLA · SOPRA</text>
<text x="70" y="493" class="label">GPIO 32</text><path d="M365 486 H620" class="wire"/>
<circle cx="632" cy="540" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 540h12" stroke="#344d39" stroke-width="2"/><text x="660" y="547" class="txt">06 · DRIVER VALVOLA · SOTTO</text>
<text x="70" y="547" class="label">GPIO 33</text><path d="M365 540 H620" class="wire"/>
<rect x="610" y="571" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="594" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 594h12" stroke="#344d39" stroke-width="2"/><text x="660" y="601" class="txt">07 · MASSA LOGICA · DRIVER ESTERNI</text>
<text x="70" y="601" class="label">GND*</text><path d="M365 594 H620" class="wire"/>
<circle cx="632" cy="648" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 648h12" stroke="#344d39" stroke-width="2"/><text x="660" y="655" class="txt">08 · ALIMENTAZIONE MODULI RELÈ</text>
<text x="70" y="655" class="label">+5 V*</text><path d="M365 648 H620" class="wire"/>
<rect x="610" y="679" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="702" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 702h12" stroke="#344d39" stroke-width="2"/><text x="660" y="709" class="txt">09 · ALIMENTAZIONE POMPA +</text>
<circle cx="632" cy="756" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 756h12" stroke="#344d39" stroke-width="2"/><text x="660" y="763" class="txt">10 · ALIMENTAZIONE POMPA −</text>
<rect x="610" y="787" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="810" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 810h12" stroke="#344d39" stroke-width="2"/><text x="660" y="817" class="txt">11 · POMPA +</text>
<circle cx="632" cy="864" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 864h12" stroke="#344d39" stroke-width="2"/><text x="660" y="871" class="txt">12 · POMPA −</text>
<rect x="610" y="895" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="918" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 918h12" stroke="#344d39" stroke-width="2"/><text x="660" y="925" class="txt">13 · ALIMENTAZIONE COIL +</text>
<circle cx="632" cy="972" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 972h12" stroke="#344d39" stroke-width="2"/><text x="660" y="979" class="txt">14 · ALIMENTAZIONE COIL −</text>
<rect x="610" y="1003" width="835" height="102" rx="9" class="terminal"/>
<circle cx="632" cy="1026" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 1026h12" stroke="#344d39" stroke-width="2"/><text x="660" y="1033" class="txt">15 · COIL +</text>
<circle cx="632" cy="1080" r="12" fill="#8eba8b" stroke="#d5e7bd" stroke-width="2"/><path d="M626 1080h12" stroke="#344d39" stroke-width="2"/><text x="660" y="1087" class="txt">16 · COIL −</text>
<rect x="45" y="755" width="500" height="150" rx="14" class="mos"/><text x="65" y="790" class="label">MOSFET POMPA · montato sulla millefori</text><text x="65" y="823" class="small">GPIO 26 → TRIG/PWM</text><text x="65" y="852" class="small">VIN +/− → 09–10 · OUT +/− → 11–12</text><text x="65" y="880" class="small">GND comando → GND logico, se compatibile</text><rect x="45" y="930" width="500" height="150" rx="14" class="mos"/><text x="65" y="965" class="label">DRIVER COIL · montato sulla millefori</text><text x="65" y="998" class="small">GPIO 27 → comando driver</text><text x="65" y="1027" class="small">Alimentazione → 13–14 · coil → 15–16</text><text x="65" y="1056" class="small">Schema VIN/OUT solo se driver idoneo</text><rect x="45" y="1145" width="1400" height="375" rx="14" class="warn"/><text x="65" y="1180" class="label">Prima del cablaggio</text><text x="65" y="1213" class="small">* 07–08: 5 V e GND distribuiti dall’alimentatore ai relè. ESP alimentato via USB in prova;</text><text x="65" y="1240" class="small">la massa comune e i livelli logici vanno verificati per ogni modulo prima di collegarli.</text><text x="65" y="1274" class="small">Le alimentazioni pompa e coil sono separate nello schema: tensione e corrente non sono confermate.</text><text x="65" y="1308" class="small">La pompa richiede protezione dai picchi del motore. La coil richiede driver dimensionato e protezioni indipendenti.</text><text x="65" y="1342" class="small">Le valvole richiedono driver esterni e alimentazione adatta: i GPIO non alimentano le bobine.</text><text x="65" y="1376" class="small">Le piste e i morsetti della millefori devono essere dimensionati sulla corrente reale: non ancora nota.</text><text x="65" y="1410" class="small">Non collegare 230 V alla millefori. Lato ventole e relè di potenza da verificare con tecnico qualificato.</text><text x="65" y="1444" class="small">LED e compressore esclusi. Firmware attuale in simulazione: non pilota i GPIO.</text><text x="65" y="1480" class="small">Il disegno mostra connessioni logiche: verificare posizione dei pin reali e sigle dei moduli.</text></svg>