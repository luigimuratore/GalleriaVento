<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1320" role="img" aria-labelledby="title desc"><title id="title">ESP32, compressore e valvole Festo: collegamenti preliminari</title><desc id="desc">Mappa funzionale per il comando del compressore e delle valvole sopra e sotto, con circuito pneumatico e protezioni da definire.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif}.head{fill:#fff;font-size:32px;font-weight:700}.sub{fill:#c4d2df;font-size:18px}.tag{fill:#a6d1ff;font-size:15px;font-weight:700;letter-spacing:2px}.box{fill:#1b3448;stroke:#6999b8;stroke-width:2}.driver{fill:#263e54;stroke:#80aecd;stroke-width:2}.warnbox{fill:#443329;stroke:#d3a76b;stroke-width:2}.load{fill:#263843;stroke:#7e9eaa;stroke-width:2}.h{fill:#f6f9fc;font-size:21px;font-weight:700}.t{fill:#cddbe6;font-size:17px}.small{fill:#bfcfdb;font-size:15px}.pin{fill:#b7dfff;font-size:19px;font-weight:700}.warn{fill:#ffdda9;font-size:17px;font-weight:700}.sig{fill:none;stroke:#8bc9ff;stroke-width:4;stroke-dasharray:9 6}.air{fill:none;stroke:#6fd4c8;stroke-width:4}.protect{fill:none;stroke:#ffb197;stroke-width:3;stroke-dasharray:8 7}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="1500" height="1320" rx="20" fill="#101925"/><text x="48" y="49" class="tag">SIB / SISTEMA FLUSSI</text><text x="48" y="93" class="head">ESP32, compressore e valvole</text><text x="48" y="125" class="sub">Terzo sistema · il compressore è separato dalla pompa del fumo.</text>
<rect x="48" y="150" width="1404" height="76" rx="12" class="warnbox"/><text x="68" y="181" class="warn">BOZZA: non alimentare né mettere in pressione prima di identificare i componenti.</text><text x="68" y="208" class="small">Tensione e corrente di compressore e valvole, porti Festo e protezioni sono ancora da verificare.</text>
<text x="48" y="270" class="tag">1 / COLLEGAMENTI ELETTRICI · LINEE TRATTEGGIATE DA DEFINIRE</text>
<rect x="48" y="295" width="280" height="380" rx="16" class="box"/><text x="68" y="335" class="h">ESP32-WROOM</text><text x="68" y="363" class="small">Segnali proposti a 3,3 V</text><text x="68" y="428" class="pin">GPIO 18</text><text x="68" y="523" class="pin">GPIO 32</text><text x="68" y="618" class="pin">GPIO 33</text>
<rect x="440" y="380" width="430" height="80" rx="12" class="driver"/><text x="460" y="413" class="h">DRIVER / CONTATTORE</text><text x="460" y="440" class="small">Scelta in base al compressore AC o DC</text>
<rect x="440" y="475" width="430" height="80" rx="12" class="driver"/><text x="460" y="508" class="h">DRIVER VALVOLA 1</text><text x="460" y="535" class="small">Per il condotto sopra l’ala</text>
<rect x="440" y="570" width="430" height="80" rx="12" class="driver"/><text x="460" y="603" class="h">DRIVER VALVOLA 2</text><text x="460" y="630" class="small">Per il condotto sotto l’ala</text>
<rect x="990" y="380" width="462" height="80" rx="12" class="load"/><text x="1010" y="413" class="h">COMPRESSORE</text><text x="1010" y="440" class="small">Tensione e corrente da identificare</text>
<rect x="990" y="475" width="462" height="80" rx="12" class="load"/><text x="1010" y="508" class="h">ELETTROVALVOLA FESTO 1</text><text x="1010" y="535" class="small">Sigla, tensione e tipo da identificare</text>
<rect x="990" y="570" width="462" height="80" rx="12" class="load"/><text x="1010" y="603" class="h">ELETTROVALVOLA FESTO 2</text><text x="1010" y="630" class="small">Sigla, tensione e tipo da identificare</text>
<g class="sig" marker-end="url(#arrow)"><path d="M328 420H430"/><path d="M328 515H430"/><path d="M328 610H430"/><path d="M870 420H980"/><path d="M870 515H980"/><path d="M870 610H980"/></g>
<text x="48" y="718" class="small">Le frecce indicano le funzioni, non il cablaggio dei morsetti. Alimentazioni e riferimenti GND dipendono dai driver scelti.</text><text x="48" y="743" class="small">Un modulo XY-MOS si può valutare solo per bobine DC compatibili, dopo verifica di tensione, corrente e comando a 3,3 V.</text>
<text x="48" y="800" class="tag">2 / ARIA COMPRESSA · PERCORSO DI PRINCIPIO</text>
<rect x="48" y="830" width="235" height="86" rx="12" class="load"/><text x="68" y="865" class="h">Compressore</text><text x="68" y="891" class="small">Modello da identificare</text>
<rect x="335" y="830" width="315" height="86" rx="12" class="warnbox"/><text x="355" y="865" class="h">Regolatore + manometro</text><text x="355" y="891" class="small">Protezione pressione da definire</text>
<rect x="710" y="830" width="245" height="86" rx="12" class="load"/><text x="730" y="865" class="h">Collettore</text><text x="730" y="891" class="small">Distribuzione aria</text>
<rect x="1010" y="785" width="215" height="74" rx="12" class="load"/><text x="1030" y="817" class="h">Festo 1</text><text x="1030" y="842" class="small">Sopra l’ala</text>
<rect x="1010" y="885" width="215" height="74" rx="12" class="load"/><text x="1030" y="917" class="h">Festo 2</text><text x="1030" y="942" class="small">Sotto l’ala</text>
<rect x="1280" y="830" width="172" height="86" rx="12" class="box"/><text x="1300" y="865" class="h">ALA</text><text x="1300" y="891" class="small">Condotti</text>
<g class="air" marker-end="url(#arrow)"><path d="M283 873H325"/><path d="M650 873H700"/><path d="M955 873H980V822H1000"/><path d="M955 873H980V922H1000"/><path d="M1225 822H1255V850H1270"/><path d="M1225 922H1255V896H1270"/></g>
<rect x="48" y="1000" width="1404" height="185" rx="14" class="warnbox"/><text x="68" y="1037" class="h">Da definire prima di costruire il circuito</text><text x="68" y="1067" class="t">• Codici Festo: tipo valvola, tensione bobina, morsetti e funzione dei porti; non assumere 12 V o NC.</text><text x="68" y="1096" class="t">• Targa compressore: tensione, corrente, pressione e gestione del funzionamento con valvole chiuse.</text><text x="68" y="1125" class="t">• Limitazione pressione e scarico sicuro; interblocco hardware se richiesto dall’analisi del circuito.</text><text x="68" y="1154" class="t">• Driver e protezioni contro transitori, stato sicuro al reset e arresto fisico indipendente dall’ESP.</text>
<text x="48" y="1235" class="sub">SOPRA / NEUTRO / SOTTO sono gli stati desiderati; i collegamenti pneumatici esatti dipendono dalle Festo.</text><text x="48" y="1264" class="small">La linea del compressore a 230 V, se presente, richiede progetto e verifica da personale qualificato.</text><text x="48" y="1293" class="small">Il firmware attuale è in simulazione: non comanda GPIO, compressore o valvole.</text>
</svg>
