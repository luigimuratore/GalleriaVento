<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1120" role="img" aria-labelledby="title desc"><title id="title">ESP32-WROOM: mappa dei GPIO per la galleria del vento</title><desc id="desc">Mappa logica indicativa dei segnali GPIO dell'ESP32 e dei driver dei dispositivi. Non è il pinout fisico della scheda.</desc><defs><style>text{font-family:Arial,Helvetica,sans-serif}.head{fill:#fff;font-size:32px;font-weight:700}.sub{fill:#c2d0de;font-size:18px}.tag{fill:#a7cff6;font-size:15px;font-weight:700;letter-spacing:2px}.board{fill:#1a3449;stroke:#73a0bc;stroke-width:2}.driver{fill:#303648;stroke:#929cb4;stroke-width:2}.load{fill:#263b46;stroke:#7da1ae;stroke-width:2}.warnbox{fill:#443729;stroke:#d7ad74;stroke-width:2}.h{fill:#fff;font-size:22px;font-weight:700}.t{fill:#cbd9e6;font-size:17px}.small{fill:#becedb;font-size:15px}.pin{fill:#b6ddff;font-size:20px;font-weight:700}.signal{fill:none;stroke:#8acbff;stroke-width:3}.node{fill:#b6ddff}.warn{fill:#ffdda7;font-size:16px}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="1500" height="1120" rx="20" fill="#101925"/><text x="50" y="48" class="tag">SIB / GALLERIA DEL VENTO</text><text x="50" y="92" class="head">ESP32-WROOM · mappa dei GPIO</text><text x="50" y="124" class="sub">Numeri GPIO proposti per la Freenove · schema logico, non posizione fisica dei pin</text>
<rect x="50" y="150" width="1400" height="72" rx="12" class="warnbox"/><text x="70" y="180" class="h">Bozza: verifica il pinout della tua scheda prima di saldare.</text><text x="70" y="207" class="small">Il firmware caricato è in simulazione e non attiva queste uscite.</text>
<rect x="50" y="270" width="280" height="630" rx="18" class="board"/><text x="70" y="310" class="h">ESP32-WROOM</text><text x="70" y="338" class="small">Segnali a 3,3 V</text>
<g class="pin"><text x="70" y="403">GPIO 25</text><text x="70" y="478">GPIO 26</text><text x="70" y="553">GPIO 27</text><text x="70" y="628">GPIO 32</text><text x="70" y="703">GPIO 33</text><text x="70" y="778">GPIO 18</text><text x="70" y="853">GPIO 19</text></g>
<g class="signal" marker-end="url(#arrow)"><path d="M315 397H398"/><path d="M315 472H398"/><path d="M315 547H398"/><path d="M315 622H398"/><path d="M315 697H398"/><path d="M315 772H398"/><path d="M315 847H398"/></g>
<g fill="#b6ddff"><circle cx="315" cy="397" r="5"/><circle cx="315" cy="472" r="5"/><circle cx="315" cy="547" r="5"/><circle cx="315" cy="622" r="5"/><circle cx="315" cy="697" r="5"/><circle cx="315" cy="772" r="5"/><circle cx="315" cy="847" r="5"/></g>
<rect x="405" y="366" width="460" height="62" rx="10" class="driver"/><text x="423" y="392" class="h">Relè / interfaccia verificata</text><text x="423" y="415" class="small">Ingresso 3,3 V e polarità da verificare</text>
<rect x="405" y="441" width="460" height="62" rx="10" class="driver"/><text x="423" y="467" class="h">XY-MOS · pompa</text><text x="423" y="490" class="small">Tensione e corrente pompa ignote</text>
<rect x="405" y="516" width="460" height="62" rx="10" class="warnbox"/><text x="423" y="542" class="h">Driver coil da definire</text><text x="423" y="565" class="small">Consensi fisici indipendenti obbligatori</text>
<rect x="405" y="591" width="460" height="62" rx="10" class="driver"/><text x="423" y="617" class="h">Driver valvola 1</text><text x="423" y="640" class="small">Tipo e tensione Festo da identificare</text>
<rect x="405" y="666" width="460" height="62" rx="10" class="driver"/><text x="423" y="692" class="h">Driver valvola 2</text><text x="423" y="715" class="small">Tipo e tensione Festo da identificare</text>
<rect x="405" y="741" width="460" height="62" rx="10" class="driver"/><text x="423" y="767" class="h">Driver / contattore compressore</text><text x="423" y="790" class="small">Tipo e alimentazione da identificare</text>
<rect x="405" y="816" width="460" height="62" rx="10" class="driver"/><text x="423" y="842" class="h">Driver LED DC</text><text x="423" y="865" class="small">Due strisce 12 V comandate insieme</text>
<g class="signal" marker-end="url(#arrow)"><path d="M865 397H918"/><path d="M865 472H918"/><path d="M865 547H918"/><path d="M865 622H918"/><path d="M865 697H918"/><path d="M865 772H918"/><path d="M865 847H918"/></g>
<g class="load"><rect x="925" y="366" width="525" height="62" rx="10"/><rect x="925" y="441" width="525" height="62" rx="10"/><rect x="925" y="516" width="525" height="62" rx="10"/><rect x="925" y="591" width="525" height="62" rx="10"/><rect x="925" y="666" width="525" height="62" rx="10"/><rect x="925" y="741" width="525" height="62" rx="10"/><rect x="925" y="816" width="525" height="62" rx="10"/></g>
<text x="945" y="403" class="h">ARIA · contattore → 4 ventole</text><text x="945" y="478" class="h">FUMO · pompa aria</text><text x="945" y="553" class="h">FUMO · coil</text><text x="945" y="628" class="h">FLUSSI · sopra</text><text x="945" y="703" class="h">FLUSSI · sotto</text><text x="945" y="778" class="h">FLUSSI · compressore</text><text x="945" y="853" class="h">LUCI · LED 1 + LED 2</text>
<rect x="50" y="935" width="1400" height="135" rx="13" class="warnbox"/><text x="70" y="968" class="h">Collegamenti da definire prima delle prove</text><text x="70" y="997" class="t">Alimentazioni, GND, fusibili, protezioni induttive e livelli dei moduli dipendono dai componenti reali.</text><text x="70" y="1025" class="t">Non portare 230 V o la corrente dei carichi sui GPIO. Coil e arresto richiedono protezioni indipendenti.</text><text x="70" y="1053" class="warn">Le luci non hanno ancora un pulsante dedicato nella dashboard. Nessun filo di potenza è illustrato.</text>
</svg>
