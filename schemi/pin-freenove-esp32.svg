<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title"><title id="title">Mappa preliminare pin Freenove ESP32 WROOM</title><style>text{font-family:Arial,sans-serif}.title{font-size:31px;font-weight:bold;fill:#fff}.sub{font-size:17px;fill:#bfcbd8}.label{font-size:21px;font-weight:bold;fill:#fff}.pin{font-size:21px;font-weight:bold;fill:#9ccfff}.small{font-size:16px;fill:#c6d4e2}.line{fill:none;stroke:#75b9f4;stroke-width:3}</style><rect width="1200" height="850" rx="20" fill="#111925"/><text x="48" y="58" class="title">Freenove ESP32-WROOM · mappa pin</text><text x="48" y="90" class="sub">Schema logico indicativo · verifica la revisione della scheda e i driver reali</text><rect x="48" y="130" width="300" height="550" rx="18" fill="#19334a" stroke="#6196bd" stroke-width="2"/><text x="70" y="170" class="label">ESP32-WROOM</text><text x="70" y="197" class="small">Numeri GPIO · logica 3,3 V</text><text x="75" y="256" class="pin">GPIO 25</text><path class="line" d="M330 250 H445"/><circle cx="330" cy="250" r="5" fill="#75b9f4"/><rect x="445" y="227" width="700" height="46" rx="8" fill="#283847" stroke="#526d80"/><text x="463" y="256" class="label">ARIA</text><text x="730" y="256" class="small">Relè / contattore</text><text x="75" y="314" class="pin">GPIO 26</text><path class="line" d="M330 308 H445"/><circle cx="330" cy="308" r="5" fill="#75b9f4"/><rect x="445" y="285" width="700" height="46" rx="8" fill="#283847" stroke="#526d80"/><text x="463" y="314" class="label">POMPA</text><text x="730" y="314" class="small">Driver DC</text><text x="75" y="372" class="pin">GPIO 27</text><path class="line" d="M330 366 H445"/><circle cx="330" cy="366" r="5" fill="#75b9f4"/><rect x="445" y="343" width="700" height="46" rx="8" fill="#283847" stroke="#526d80"/><text x="463" y="372" class="label">COIL</text><text x="730" y="372" class="small">Driver dedicato + consensi</text><text x="75" y="430" class="pin">GPIO 32</text><path class="line" d="M330 424 H445"/><circle cx="330" cy="424" r="5" fill="#75b9f4"/><rect x="445" y="401" width="700" height="46" rx="8" fill="#283847" stroke="#526d80"/><text x="463" y="430" class="label">VALVOLA SOPRA</text><text x="730" y="430" class="small">Driver valvola</text><text x="75" y="488" class="pin">GPIO 33</text><path class="line" d="M330 482 H445"/><circle cx="330" cy="482" r="5" fill="#75b9f4"/><rect x="445" y="459" width="700" height="46" rx="8" fill="#283847" stroke="#526d80"/><text x="463" y="488" class="label">VALVOLA SOTTO</text><text x="730" y="488" class="small">Driver valvola</text><text x="75" y="546" class="pin">GPIO 18</text><path class="line" d="M330 540 H445"/><circle cx="330" cy="540" r="5" fill="#75b9f4"/><rect x="445" y="517" width="700" height="46" rx="8" fill="#283847" stroke="#526d80"/><text x="463" y="546" class="label">COMPRESSORE</text><text x="730" y="546" class="small">Driver adatto</text><text x="75" y="604" class="pin">GPIO 19</text><path class="line" d="M330 598 H445"/><circle cx="330" cy="598" r="5" fill="#75b9f4"/><rect x="445" y="575" width="700" height="46" rx="8" fill="#283847" stroke="#526d80"/><text x="463" y="604" class="label">LED</text><text x="730" y="604" class="small">Driver DC</text><text x="50" y="730" class="sub">Firmware attuale: simulazione; i GPIO non pilotano carichi.</text><text x="50" y="760" class="sub">Le linee indicano i segnali, non alimentazione, protezioni o collegamenti a 230 V.</text><text x="50" y="790" class="sub">Coil e motori richiedono protezioni indipendenti e verifica qualificata.</text></svg>