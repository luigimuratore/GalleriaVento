<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Galleria del vento — schema funzionale</title><desc id="desc">Schema a blocchi del collegamento tra alimentazione, ESP8266, driver, carichi e impianto pneumatico. Non è uno schema di cablaggio.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker><style>
.bg{fill:#0d1514}.card{fill:#162220;stroke:#40554c;stroke-width:1.5}.safety{fill:#291e1a;stroke:#d39b71}.pneu{fill:#16262c;stroke:#537b89}.label{fill:#f1f5ed;font:600 18px system-ui,sans-serif}.small{fill:#aabcb2;font:14px system-ui,sans-serif}.title{fill:#f1f5ed;font:700 28px system-ui,sans-serif}.kicker{fill:#bdfa7e;font:700 13px system-ui,sans-serif;letter-spacing:2px}.power{fill:none;stroke:#f2bb75;stroke-width:3}.ctrl{fill:none;stroke:#bdfa7e;stroke-width:2.5;stroke-dasharray:7 5}.air{fill:none;stroke:#7ccbe4;stroke-width:3}.icon{fill:none;stroke:#c6f5b1;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.note{fill:#d9c4a4;font:14px system-ui,sans-serif}
</style></defs><rect class="bg" width="1200" height="1000" rx="22"/><text class="kicker" x="38" y="46">VENTO / BOZZA DI PROGETTO</text><text class="title" x="38" y="82">Come si collegano i dispositivi</text><text class="small" x="38" y="110">Schema funzionale · i percorsi indicano funzioni, non morsetti o cablaggi esecutivi</text>
