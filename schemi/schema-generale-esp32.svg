<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1800" role="img" aria-labelledby="title desc"><title id="title">Galleria del vento: schema funzionale generale</title><desc id="desc">Proposta di collegamento divisa in alimentazione 230 volt, distribuzione continua da verificare, ESP32 e aria compressa. Non è uno schema di cablaggio esecutivo.</desc><defs><style>
text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f4f8fc;font-size:34px;font-weight:700}.sub{fill:#c2d0de;font-size:19px}.kicker{fill:#a1ccfc;font-size:15px;font-weight:700;letter-spacing:2px}.h{fill:#fff;font-size:22px;font-weight:700}.t{fill:#d3dfea;font-size:17px}.tiny{fill:#b8c9d8;font-size:15px}.pin{fill:#a1d3ff;font-size:18px;font-weight:700}.danger{fill:#ffd19a;font-size:16px}.block{fill:#203249;stroke:#6b91b3;stroke-width:2}.ac{fill:#432d28;stroke:#db9c69;stroke-width:2}.dc{fill:#173b40;stroke:#67b3b0;stroke-width:2}.driver{fill:#323442;stroke:#8c91ab;stroke-width:2}.load{fill:#233541;stroke:#6b91a2;stroke-width:2}.warn{fill:#433326;stroke:#d6a878;stroke-width:2}.logic{fill:none;stroke:#91c8fc;stroke-width:3}.wire12{fill:none;stroke:#70d1bb;stroke-width:3}.wire5{fill:none;stroke:#c9acff;stroke-width:3}.wireac{fill:none;stroke:#f0ad69;stroke-width:4}.air{fill:none;stroke:#92dce4;stroke-width:3}.dash{stroke-dasharray:8 7}.black{fill:#101b26}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs><rect width="1700" height="1800" rx="20" fill="#111a25"/>
<text x="55" y="52" class="kicker">SIB · GALLERIA DEL VENTO / BOZZA 01</text><text x="55" y="99" class="title">Schema generale dei collegamenti</text><text x="55" y="132" class="sub">Linee di alimentazione, comandi ESP32 e aria compressa · schema funzionale, non esecutivo</text>
<rect x="55" y="157" width="1590" height="75" rx="12" class="warn"/><text x="75" y="187" class="danger">NON CABLARE SU QUESTO DISEGNO: tensioni e morsetti di pompa, coil e valvole sono ancora da confermare.</text><text x="75" y="214" class="tiny">Collegamenti 230 V, protezioni, terra, stato sicuro e arresto fisico richiedono progetto e verifica qualificata.</text>
<text x="55" y="276" class="kicker">01 / LINEA 230 V AC</text>
<rect x="55" y="300" width="240" height="100" rx="12" class="ac"/><text x="75" y="336" class="h">Presa 230 V</text><text x="75" y="365" class="t">Rete del capannone</text>
<rect x="345" y="300" width="290" height="100" rx="12" class="ac"/><text x="365" y="336" class="h">Protezioni e sezionatore</text><text x="365" y="365" class="t">Terra PE dove richiesta</text>
<rect x="685" y="300" width="255" height="100" rx="12" class="ac"/><text x="705" y="336" class="h">Contattore motori</text><text x="705" y="365" class="t">Selezione da dimensionare</text>
<rect x="990" y="300" width="295" height="100" rx="12" class="ac"/><text x="1010" y="336" class="h">MY-9892 manuale</text><text x="1010" y="365" class="t">Solo se fan compatibili</text>
<rect x="1335" y="300" width="310" height="100" rx="12" class="load"/><text x="1355" y="336" class="h">4 VENTOLE</text><text x="1355" y="365" class="t">220–240 V · 74,5 W cad.</text>
<g class="wireac" marker-end="url(#arrow)"><path d="M295 350H335"/><path d="M635 350H675"/><path d="M940 350H980"/><path d="M1285 350H1325"/></g>
<text x="55" y="440" class="tiny">Il MY-9892 è disegnato come possibilità: la compatibilità con le ventole FG-HVLSFAN250 non è confermata.</text>
<text x="55" y="493" class="kicker">02 / ALIMENTAZIONE DC E COMANDI ESP32</text>
<rect x="55" y="520" width="320" height="235" rx="14" class="block"/><text x="78" y="557" class="h">ESP32-WROOM</text><text x="78" y="585" class="t">Comandi a 3,3 V</text><text x="78" y="617" class="tiny">Firmware attuale: simulazione</text><text x="78" y="640" class="tiny">Non pilota ancora alcun pin</text><text x="78" y="681" class="t">Telefono → Wi-Fi → ESP</text><text x="78" y="711" class="tiny">Pin indicati solo come proposta</text>
<rect x="410" y="520" width="350" height="100" rx="12" class="dc"/><text x="430" y="556" class="h">Alimentatore 12 V DC</text><text x="430" y="584" class="t">Uscita e corrente da verificare</text>
<rect x="410" y="655" width="350" height="100" rx="12" class="driver"/><text x="430" y="691" class="h">Convertitore 12 V → 5 V</text><text x="430" y="719" class="t">Idoneità e corrente da definire</text>
<path d="M490 400V470H585V510" class="wireac" marker-end="url(#arrow)"/><path d="M585 620V645" class="wire12" marker-end="url(#arrow)"/>
<rect x="800" y="520" width="365" height="100" rx="12" class="dc"/><text x="820" y="556" class="h">Distribuzione 12 V</text><text x="820" y="584" class="t">Protezioni per i singoli rami</text>
<rect x="800" y="655" width="365" height="100" rx="12" class="driver"/><text x="820" y="691" class="h">Distribuzione 5 V</text><text x="820" y="719" class="t">ESP e modulo relè: da verificare</text>
<g marker-end="url(#arrow)"><path d="M760 570H790" class="wire12"/><path d="M760 705H790" class="wire5"/><path d="M800 735H390V715H385" class="wire5"/></g>
<rect x="1205" y="520" width="440" height="235" rx="12" class="warn"/><text x="1225" y="556" class="h">Limiti da verificare</text><text x="1225" y="590" class="t">Pompa: tensione e corrente ignote</text><text x="1225" y="620" class="t">Coil: tensione e potenza ignote</text><text x="1225" y="650" class="t">Festo: tensione bobine ignota</text><text x="1225" y="680" class="t">LED 1 e LED 2: dichiarati 12 V DC</text><text x="1225" y="718" class="tiny">5 V alla scheda solo con alimentazione</text><text x="1225" y="740" class="tiny">compatibile; USB e doppie sorgenti da valutare.</text>
<text x="55" y="810" class="kicker">03 / COSA COMANDA OGNI PIN · LE FRECCE AZZURRE SONO SEGNALI, NON POTENZA</text>
<rect x="55" y="840" width="215" height="70" rx="10" class="block"/><text x="75" y="868" class="pin">GPIO 25</text><text x="75" y="892" class="tiny">ARIA</text>
<path d="M270 875H315" class="logic" marker-end="url(#arrow)"/><rect x="325" y="840" width="420" height="70" rx="10" class="driver"/><text x="345" y="869" class="h">Relè rosso 5 V</text><text x="345" y="894" class="tiny">5 V relè · ingresso 3,3 V da verificare</text>
<path d="M745 875H790" class="logic" marker-end="url(#arrow)"/><rect x="800" y="840" width="515" height="70" rx="10" class="load"/><text x="820" y="869" class="h">Interfaccia → contattore → ventole</text><text x="820" y="894" class="tiny">Segnale logico; cablaggio di potenza da definire</text><rect x="55" y="931" width="215" height="70" rx="10" class="block"/><text x="75" y="959" class="pin">GPIO 26</text><text x="75" y="983" class="tiny">FUMO</text>
<path d="M270 966H315" class="logic" marker-end="url(#arrow)"/><rect x="325" y="931" width="420" height="70" rx="10" class="driver"/><text x="345" y="960" class="h">XY-MOS · pompa</text><text x="345" y="985" class="tiny">Alimentazione DC pompa da identificare</text>
<path d="M745 966H790" class="logic" marker-end="url(#arrow)"/><rect x="800" y="931" width="515" height="70" rx="10" class="load"/><text x="820" y="960" class="h">Pompa aria</text><text x="820" y="985" class="tiny">Segnale logico; cablaggio di potenza da definire</text><rect x="55" y="1022" width="215" height="70" rx="10" class="block"/><text x="75" y="1050" class="pin">GPIO 27</text><text x="75" y="1074" class="tiny">FUMO</text>
<path d="M270 1057H315" class="logic" marker-end="url(#arrow)"/><rect x="325" y="1022" width="420" height="70" rx="10" class="driver"/><text x="345" y="1051" class="h">Driver coil dedicato</text><text x="345" y="1076" class="tiny">Alimentazione e protezioni da definire</text>
<path d="M745 1057H790" class="logic" marker-end="url(#arrow)"/><rect x="800" y="1022" width="515" height="70" rx="10" class="load"/><text x="820" y="1051" class="h">Atomizzatore / coil</text><text x="820" y="1076" class="tiny">Segnale logico; cablaggio di potenza da definire</text><rect x="55" y="1113" width="215" height="70" rx="10" class="block"/><text x="75" y="1141" class="pin">GPIO 32</text><text x="75" y="1165" class="tiny">FLUSSI</text>
<path d="M270 1148H315" class="logic" marker-end="url(#arrow)"/><rect x="325" y="1113" width="420" height="70" rx="10" class="driver"/><text x="345" y="1142" class="h">Driver valvola sopra</text><text x="345" y="1167" class="tiny">Tensione bobina da identificare</text>
<path d="M745 1148H790" class="logic" marker-end="url(#arrow)"/><rect x="800" y="1113" width="515" height="70" rx="10" class="load"/><text x="820" y="1142" class="h">Valvola FESTO 1</text><text x="820" y="1167" class="tiny">Segnale logico; cablaggio di potenza da definire</text><rect x="55" y="1204" width="215" height="70" rx="10" class="block"/><text x="75" y="1232" class="pin">GPIO 33</text><text x="75" y="1256" class="tiny">FLUSSI</text>
<path d="M270 1239H315" class="logic" marker-end="url(#arrow)"/><rect x="325" y="1204" width="420" height="70" rx="10" class="driver"/><text x="345" y="1233" class="h">Driver valvola sotto</text><text x="345" y="1258" class="tiny">Tensione bobina da identificare</text>
<path d="M745 1239H790" class="logic" marker-end="url(#arrow)"/><rect x="800" y="1204" width="515" height="70" rx="10" class="load"/><text x="820" y="1233" class="h">Valvola FESTO 2</text><text x="820" y="1258" class="tiny">Segnale logico; cablaggio di potenza da definire</text><rect x="55" y="1295" width="215" height="70" rx="10" class="block"/><text x="75" y="1323" class="pin">GPIO 18</text><text x="75" y="1347" class="tiny">FLUSSI</text>
<path d="M270 1330H315" class="logic" marker-end="url(#arrow)"/><rect x="325" y="1295" width="420" height="70" rx="10" class="driver"/><text x="345" y="1324" class="h">Driver compressore</text><text x="345" y="1349" class="tiny">Tipo e tensione da identificare</text>
<path d="M745 1330H790" class="logic" marker-end="url(#arrow)"/><rect x="800" y="1295" width="515" height="70" rx="10" class="load"/><text x="820" y="1324" class="h">Compressore aria</text><text x="820" y="1349" class="tiny">Segnale logico; cablaggio di potenza da definire</text><rect x="55" y="1386" width="215" height="70" rx="10" class="block"/><text x="75" y="1414" class="pin">GPIO 19</text><text x="75" y="1438" class="tiny">LUCI</text>
<path d="M270 1421H315" class="logic" marker-end="url(#arrow)"/><rect x="325" y="1386" width="420" height="70" rx="10" class="driver"/><text x="345" y="1415" class="h">XY-MOS · ramo LED</text><text x="345" y="1440" class="tiny">12 V · protezioni e corrente da dimensionare</text>
<path d="M745 1421H790" class="logic" marker-end="url(#arrow)"/><rect x="800" y="1386" width="515" height="70" rx="10" class="load"/><text x="820" y="1415" class="h">LED 1 + LED 2 insieme</text><text x="820" y="1440" class="tiny">Due strisce alimentate in parallelo solo se compatibili</text><path d="M1315 1421H1360" class="wire12" marker-end="url(#arrow)"/><text x="1372" y="1415" class="t">LED 1</text><text x="1372" y="1440" class="t">LED 2</text><rect x="55" y="1500" width="1590" height="135" rx="14" class="warn"/><text x="75" y="1535" class="h">Sicurezze indipendenti dal firmware</text><text x="75" y="1565" class="t">Arresto fisico sulle energie pericolose · consenso di flusso e protezione termica indipendenti per la coil.</text><text x="75" y="1595" class="t">Valvole: interblocco, pressione regolata e scarico sicuro in base al tipo Festo. Pompa: protezione da transitori.</text><text x="75" y="1620" class="tiny">Il timer di 40 s e lo spurgo di 3 s della dashboard sono attualmente soltanto simulati.</text>
<text x="55" y="1680" class="kicker">04 / ARIA COMPRESSA · PRESSIONE E SCARICO DA DEFINIRE</text><text x="55" y="1714" class="sub">Compressore → filtro / regolatore / manometro → Festo sopra e Festo sotto → condotti dell’ala</text><text x="55" y="1744" class="tiny">Non è possibile definire i porti pneumatici o lo stato di riposo senza il codice esatto delle valvole.</text>
<text x="55" y="1780" class="tiny">Blu: segnali ESP · Ambra: rete 230 V · Verde: linea 12 V ipotizzata · Viola: linea 5 V ipotizzata</text></svg>