<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1260" role="img" aria-labelledby="title desc">
<title id="title">Schema preliminare ESP32, modulo relè e contattore</title><desc id="desc">Comando dell'ingresso del relè da ESP32, alimentazione 5 volt del modulo e circuito indicativo della bobina DC del contattore. La parte 230 volt è rappresentata a blocchi e richiede progetto e verifica qualificata.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#fff;font-size:32px;font-weight:700}.subtitle{fill:#c2d0de;font-size:18px}.tag{fill:#a7cff6;font-size:15px;font-weight:700;letter-spacing:2px}.box{fill:#203449;stroke:#7098b8;stroke-width:2}.relay{fill:#4a2e35;stroke:#d58b91;stroke-width:2}.cont{fill:#283b42;stroke:#7fa3a3;stroke-width:2}.warn{fill:#453729;stroke:#d9ad73;stroke-width:2}.h{fill:#f5f8fb;font-size:21px;font-weight:700}.t{fill:#cddce8;font-size:17px}.small{fill:#bacbd9;font-size:15px}.mark{fill:#fff;font-size:18px;font-weight:700}.node{fill:#d9e3ec}.w5{fill:none;stroke:#d5b2fa;stroke-width:4}.gnd{fill:none;stroke:#8dacd3;stroke-width:4}.sig{fill:none;stroke:#8bd0ff;stroke-width:4}.coil{fill:none;stroke:#74d6bc;stroke-width:4}.ac{fill:none;stroke:#f4b778;stroke-width:4}.dashed{stroke-dasharray:8 7}</style></defs>
<rect width="1500" height="1260" rx="20" fill="#101925"/><text x="50" y="49" class="tag">SIB / GALLERIA DEL VENTO</text><text x="50" y="93" class="title">ESP32 → relè → contattore</text><text x="50" y="127" class="subtitle">Schema di principio · bobina del contattore ipotizzata in corrente continua</text>
<rect x="50" y="155" width="1400" height="72" rx="12" class="warn"/><text x="70" y="184" class="h">Bozza: non cablare prima di identificare contattore e scheda relè.</text><text x="70" y="210" class="small">Tensione bobina, compatibilità 3,3 V, polarità dei comandi e protezioni sono ancora da verificare.</text>
<!-- relay block -->
<rect x="510" y="280" width="465" height="465" rx="16" class="relay"/><text x="535" y="319" class="h">SCHEDA ROSSA · 2 RELÈ</text><text x="535" y="346" class="small">Usiamo un solo canale · bobine relè a 5 V</text>
<text x="535" y="407" class="mark">DC+</text><text x="535" y="472" class="mark">DC−</text><text x="535" y="537" class="mark">IN1</text><text x="535" y="610" class="small">Jumper HIGH / LOW: da verificare</text><text x="535" y="636" class="small">Ingresso a 3,3 V: da verificare</text>
<circle cx="510" cy="400" r="7" class="node"/><circle cx="510" cy="465" r="7" class="node"/><circle cx="510" cy="530" r="7" class="node"/>
<circle cx="975" cy="440" r="7" class="node"/><circle cx="975" cy="520" r="7" class="node"/><text x="875" y="447" class="mark">COM</text><text x="888" y="527" class="mark">NO</text><text x="825" y="685" class="small">NC non usato</text>
<!-- source 5 -->
<rect x="45" y="280" width="290" height="190" rx="16" class="box"/><text x="65" y="321" class="h">ALIMENTATORE</text><text x="65" y="349" class="t">5 V DC per la scheda relè</text><text x="65" y="405" class="mark">+5 V</text><text x="65" y="453" class="mark">0 V / GND</text><circle cx="335" cy="400" r="7" class="node"/><circle cx="335" cy="445" r="7" class="node"/>
<!-- ESP -->
<rect x="45" y="520" width="290" height="225" rx="16" class="box"/><text x="65" y="562" class="h">ESP32-WROOM</text><text x="65" y="594" class="small">Alimentazione propria compatibile</text><text x="65" y="649" class="mark">GPIO 25</text><text x="65" y="705" class="mark">GND</text><circle cx="335" cy="642" r="7" class="node"/><circle cx="335" cy="698" r="7" class="node"/>
<path class="w5" d="M335 400H510"/><path class="gnd" d="M335 445H415V465H510"/><path class="gnd dashed" d="M335 698H395V465H415"/><path class="sig dashed" d="M335 642H450V530H510"/>
<text x="45" y="790" class="small">GND comune e collegamento diretto GPIO → IN1 dipendono dal circuito del modulo.</text>
<text x="45" y="815" class="small">Le linee tratteggiate vanno confermate: non dare per certa la compatibilità con 3,3 V.</text>
<!-- contactor source and coil -->
<rect x="1100" y="280" width="330" height="165" rx="16" class="cont"/><text x="1120" y="321" class="h">ALIMENTAZIONE BOBINA</text><text x="1120" y="350" class="t">DC · tensione da scegliere</text><text x="1120" y="389" class="mark">+ U</text><text x="1300" y="389" class="mark">0 V</text><circle cx="1100" cy="440" r="7" class="node"/><circle cx="1430" cy="440" r="7" class="node"/>
<rect x="1100" y="530" width="330" height="215" rx="16" class="cont"/><text x="1120" y="569" class="h">CONTATTORE</text><text x="1120" y="599" class="t">Bobina DC idonea · da scegliere</text><text x="1120" y="641" class="mark">A1</text><text x="1300" y="641" class="mark">A2</text><text x="1120" y="688" class="small">Soppressione transitori secondo</text><text x="1120" y="711" class="small">il modello e la bobina effettivi.</text><circle cx="1100" cy="640" r="7" class="node"/><circle cx="1430" cy="640" r="7" class="node"/>
<path class="coil" d="M975 440H1100"/><path class="coil" d="M975 520H1025V640H1100"/><path class="coil" d="M1430 440H1460V640H1430"/>
<text x="1010" y="465" class="small">+ U → COM</text><text x="995" y="574" class="small">NO → A1</text><text x="1310" y="500" class="small">0 V → A2</text>
<!-- power -->
<text x="50" y="875" class="tag">LINEA VENTOLE · SOLO VISTA FUNZIONALE</text>
<rect x="50" y="900" width="275" height="84" rx="12" class="warn"/><text x="70" y="934" class="h">230 V + protezioni</text><text x="70" y="959" class="small">Sezionamento e terra</text>
<rect x="395" y="900" width="310" height="84" rx="12" class="cont"/><text x="415" y="934" class="h">Contatti di potenza</text><text x="415" y="959" class="small">Contattore da dimensionare</text>
<rect x="775" y="900" width="300" height="84" rx="12" class="warn"/><text x="795" y="934" class="h">MY-9892 eventuale</text><text x="795" y="959" class="small">Compatibilità da confermare</text>
<rect x="1145" y="900" width="285" height="84" rx="12" class="box"/><text x="1165" y="934" class="h">4 ventole</text><text x="1165" y="959" class="small">220–240 V AC</text>
<path class="ac" d="M325 942H395 M705 942H775 M1075 942H1145"/>
<path d="M1265 745V780H550V900" fill="none" stroke="#a1bcc6" stroke-width="2" stroke-dasharray="5 6"/><text x="785" y="776" class="small">la bobina aziona i contatti di potenza</text>
<rect x="50" y="1015" width="1380" height="176" rx="13" class="warn"/><text x="72" y="1049" class="h">Da verificare prima di alimentare</text><text x="72" y="1079" class="t">• Confrontare etichette e schema del modulo: la posizione fisica dei morsetti qui non è in scala.</text><text x="72" y="1107" class="t">• Scegliere il contattore per il carico motore; controllare bobina, alimentazione e soppressione transitori.</text><text x="72" y="1135" class="t">• Arresto fisico e stato sicuro indipendenti dal firmware; la scheda attuale è in simulazione.</text><text x="72" y="1163" class="t">• Alimentazione 230 V, terra e protezioni: progetto e verifica da personale qualificato.</text>
<text x="50" y="1230" class="small">Viola: 5 V modulo · Azzurro: comando ESP · Blu: GND da confermare · Verde: circuito bobina DC · Ambra: 230 V funzionale</text>
</svg>
