<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title"><title id="title">Esempio indicativo di collegamento di un carico DC con modulo MOSFET</title><defs><style>text{font-family:Arial,sans-serif}.title{font-size:30px;font-weight:bold;fill:#f0f6ed}.sub{font-size:17px;fill:#bbccc0}.label{font-size:21px;font-weight:bold;fill:#edf6eb}.small{font-size:16px;fill:#c1d1c4}.power{fill:none;stroke:#f2bb75;stroke-width:4}.ground{fill:none;stroke:#84afe4;stroke-width:4}.signal{fill:none;stroke:#bffa8d;stroke-width:4}.box{fill:#1a2923;stroke:#7d9b81;stroke-width:2}.mod{fill:#2d291e;stroke:#bea675;stroke-width:2}.load{fill:#192b35;stroke:#6c96a9;stroke-width:2}</style></defs><rect width="1400" height="820" rx="20" fill="#0d1714"/><text x="45" y="58" class="title">Un esempio: collegamento di un carico DC</text><text x="45" y="90" class="sub">Caso ipotetico: carico e alimentatore 12 V DC, modulo MOSFET low-side non isolato.</text><text x="45" y="115" class="sub">Schema di principio: nomi dei morsetti e protezioni dipendono dal modulo effettivo.</text>
<rect x="45" y="195" width="250" height="180" rx="16" class="box"/><text x="70" y="235" class="label">Alimentatore</text><text x="70" y="267" class="small">12 V DC indicativi</text><text x="70" y="311" class="label">+12 V</text><text x="70" y="347" class="label">− / GND</text>
<rect x="485" y="180" width="300" height="150" rx="16" class="load"/><text x="510" y="220" class="label">Carico 12 V DC</text><text x="510" y="250" class="small">Pompa, valvola o LED</text><text x="510" y="287" class="label">+                 −</text>
<rect x="880" y="350" width="435" height="230" rx="16" class="mod"/><text x="905" y="390" class="label">Modulo MOSFET DC low-side</text><text x="905" y="420" class="small">Morsetti illustrativi, non universali</text><text x="905" y="460" class="label">LOAD−</text><text x="905" y="510" class="label">GND / alimentazione −</text><text x="905" y="560" class="label">IN · comando 3,3 V</text>
<rect x="45" y="450" width="250" height="130" rx="16" class="box"/><text x="70" y="490" class="label">ESP8266 D1 mini</text><text x="70" y="525" class="label">GND</text><text x="70" y="560" class="label">D2 / D6 / D7 / D0</text>
<path class="power" d="M295 302 H430 V282 H515"/><text x="320" y="281" class="small">+12 V</text><path class="ground" d="M705 282 H820 V453 H880"/><text x="750" y="263" class="small">− carico</text><path class="ground" d="M295 340 H350 V670 H835 V503 H880"/><path class="ground" d="M295 520 H350"/><path class="signal" d="M295 555 H780 V553 H880"/>
<text x="45" y="720" class="sub">Pompa e valvole: soppressione dei transitori adeguata al carico; verificare se è già presente nel modulo.</text><text x="45" y="749" class="sub">Il modulo può richiedere anche un'alimentazione separata: seguire la sua scheda tecnica.</text><text x="45" y="778" class="sub">La coil, la rete 230 V e i circuiti di sicurezza non sono coperti da questo esempio.</text></svg>
