<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1770" role="img" aria-labelledby="title desc">
<title id="title">Disposizione indicativa della millefori con D1 mini e 12 morsetti</title><desc id="desc">Vista dall'alto. Scheda D1 mini a sinistra, sei morsetti doppi a destra. Le etichette indicano la funzione prevista di ogni polo.</desc>
<defs><pattern id="holes" width="19" height="19" patternUnits="userSpaceOnUse"><circle cx="9.5" cy="9.5" r="2" fill="#8a724a" opacity=".4"/></pattern><style>text{font-family:Arial,sans-serif}.title{font-size:32px;font-weight:700;fill:#ecf5ec}.subtitle{font-size:17px;fill:#abc1b3}.card{fill:#1a2e27;stroke:#688771;stroke-width:2}.name{font-size:22px;font-weight:700;fill:#f0f6ee}.small{font-size:16px;fill:#c1d3c5}.pin{font:700 15px monospace;fill:#e7f7df}.num{font-size:15px;font-weight:700;fill:#30453b}.term{fill:#bed28d;stroke:#7c9b5f;stroke-width:2}.screw{fill:#d3dcc0;stroke:#64765c;stroke-width:2}.ink{font-size:16px;font-weight:700;fill:#edf5e9}.desc{font-size:15px;fill:#bed3c5}.tag{font-size:15px;font-weight:700;fill:#bdf493}.warn{font-size:15px;fill:#eed1ab}</style></defs>
<rect width="1200" height="1770" rx="20" fill="#0d1814"/><text x="48" y="50" class="tag">VENTO / BOZZA MECCANICA</text><text x="48" y="92" class="title">Millefori · vista dall’alto</text><text x="48" y="122" class="subtitle">1 ESP estraibile + 6 morsetti doppi = 12 poli · dimensioni non in scala</text>
<rect x="45" y="150" width="1110" height="640" rx="18" fill="#604e36" stroke="#c0a479" stroke-width="2"/><rect x="45" y="150" width="1110" height="640" rx="18" fill="url(#holes)"/>
<text x="83" y="193" class="ink">D1 mini su header femmina</text><text x="660" y="193" class="ink">Morsetti a vite · 6 moduli da 2 poli</text>
<!-- Board, USB below, pin positions as in supplied photo. -->
<rect x="155" y="232" width="330" height="454" rx="17" fill="#174969" stroke="#8ab4c1" stroke-width="3"/><rect x="190" y="248" width="260" height="75" rx="5" fill="#172622" stroke="#bba867" stroke-width="2"/><path d="M210 299v-35h35v21h25v-21h25v21h25v-21h25v21h25v-21h30v35" fill="none" stroke="#cba85d" stroke-width="5"/><rect x="215" y="350" width="210" height="175" rx="8" fill="#a1a69c" stroke="#e3e7dc" stroke-width="2"/><text x="244" y="400" fill="#31463d" font-size="20" font-weight="700">ESP8266MOD</text><text x="263" y="431" fill="#31463d" font-size="16">D1 mini</text><rect x="273" y="665" width="94" height="40" rx="5" fill="#c2c9c6" stroke="#e6eee9"/><text x="290" y="692" fill="#263932" font-size="15" font-weight="700">USB</text>
<g fill="#d5c192" stroke="#f2dfac" stroke-width="2"><circle cx="170" cy="380" r="7"/><circle cx="170" cy="414" r="7"/><circle cx="170" cy="448" r="7"/><circle cx="170" cy="482" r="7"/><circle cx="170" cy="516" r="7"/><circle cx="170" cy="550" r="7"/><circle cx="170" cy="584" r="7"/><circle cx="170" cy="618" r="7"/><circle cx="470" cy="380" r="7"/><circle cx="470" cy="414" r="7"/><circle cx="470" cy="448" r="7"/><circle cx="470" cy="482" r="7"/><circle cx="470" cy="516" r="7"/><circle cx="470" cy="550" r="7"/><circle cx="470" cy="584" r="7"/><circle cx="470" cy="618" r="7"/></g>
<g text-anchor="end" class="pin"><text x="150" y="385">RST</text><text x="150" y="419">A0</text><text x="150" y="453">D0</text><text x="150" y="487">D5</text><text x="150" y="521">D6</text><text x="150" y="555">D7</text><text x="150" y="589">D8</text><text x="150" y="623">3V3</text></g>
<g class="pin"><text x="490" y="385">TX</text><text x="490" y="419">RX</text><text x="490" y="453">D1</text><text x="490" y="487">D2</text><text x="490" y="521">D3</text><text x="490" y="555">D4</text><text x="490" y="589">G</text><text x="490" y="623">5V</text></g>
<text x="86" y="740" class="small">Rispetta il verso degli header. USB accessibile.</text>
<!-- Screw terminal groups: each rectangle exactly 2 screws -->
<g transform="translate(650 220)"><rect width="120" height="56" rx="6" class="term"/><circle cx="30" cy="28" r="17" class="screw"/><circle cx="90" cy="28" r="17" class="screw"/><path d="M21 28h18 M81 28h18" stroke="#61705b" stroke-width="3"/><text x="140" y="20" class="ink">1 · D1 → driver ventole</text><text x="140" y="46" class="ink">2 · D2 → driver pompa</text></g>
<g transform="translate(650 300)"><rect width="120" height="56" rx="6" class="term"/><circle cx="30" cy="28" r="17" class="screw"/><circle cx="90" cy="28" r="17" class="screw"/><path d="M21 28h18 M81 28h18" stroke="#61705b" stroke-width="3"/><text x="140" y="20" class="ink">3 · D5 → richiesta coil</text><text x="140" y="46" class="ink">4 · D6 → valvola sopra</text></g>
<g transform="translate(650 380)"><rect width="120" height="56" rx="6" class="term"/><circle cx="30" cy="28" r="17" class="screw"/><circle cx="90" cy="28" r="17" class="screw"/><path d="M21 28h18 M81 28h18" stroke="#61705b" stroke-width="3"/><text x="140" y="20" class="ink">5 · D7 → valvola sotto</text><text x="140" y="46" class="ink">6 · D8 → compressore</text></g>
<g transform="translate(650 460)"><rect width="120" height="56" rx="6" class="term"/><circle cx="30" cy="28" r="17" class="screw"/><circle cx="90" cy="28" r="17" class="screw"/><path d="M21 28h18 M81 28h18" stroke="#61705b" stroke-width="3"/><text x="140" y="20" class="ink">7 · D0 → driver LED</text><text x="140" y="46" class="ink">8 · GND → riferimento segnali*</text></g>
<g transform="translate(650 540)"><rect width="120" height="56" rx="6" class="term"/><circle cx="30" cy="28" r="17" class="screw"/><circle cx="90" cy="28" r="17" class="screw"/><path d="M21 28h18 M81 28h18" stroke="#61705b" stroke-width="3"/><text x="140" y="20" class="ink">9 · 5 V → ingresso alimentazione*</text><text x="140" y="46" class="ink">10 · GND → alimentazione*</text></g>
<g transform="translate(650 620)"><rect width="120" height="56" rx="6" class="term"/><circle cx="30" cy="28" r="17" class="screw"/><circle cx="90" cy="28" r="17" class="screw"/><path d="M21 28h18 M81 28h18" stroke="#61705b" stroke-width="3"/><text x="140" y="20" class="ink">11 · LIBERO</text><text x="140" y="46" class="ink">12 · LIBERO</text></g>
<text x="650" y="726" class="small">Per ogni modulo: vite sinistra = prima riga;</text><text x="650" y="748" class="small">vite destra = seconda riga.</text>
<rect x="45" y="812" width="1110" height="160" rx="14" class="card"/><text x="65" y="843" class="ink">Prima di saldare i collegamenti</text><text x="65" y="869" class="desc">• Posizione indicativa: verifica passo e ingombri dei morsetti, zoccoli e componenti reali.</text><text x="65" y="893" class="desc">• I morsetti D0–D8 sono segnali logici: i carichi si collegano solo tramite driver adatti.</text><text x="65" y="917" class="desc">• *GND e 5 V dipendono da driver e alimentatore; non applicare 12 V al morsetto 5 V.</text><text x="65" y="941" class="warn">• Solo bassa tensione sulla millefori. Coil, 230 V e protezioni richiedono circuiti dedicati.</text><text x="65" y="963" class="desc">D8 deve restare basso al boot. Il firmware attuale è ancora in sola simulazione.</text>
<text x="48" y="1030" class="title">Collegamenti sulla millefori</text>
<text x="48" y="1060" class="subtitle">Ogni linea rappresenta un filo da saldare sotto la scheda, tra lo zoccolo e il morsetto.</text>
<text x="48" y="1083" class="subtitle">Percorso schematico: controlla continuità e assenza di corti. I colori servono solo a distinguere i fili.</text>
<rect x="55" y="1110" width="300" height="510" rx="14" class="card"/><text x="75" y="1145" class="name">Pin dell’ESP</text>
<rect x="835" y="1110" width="310" height="510" rx="14" class="card"/><text x="855" y="1145" class="name">Polo del morsetto</text><text x="78" y="1183" class="pin">D1</text><circle cx="340" cy="1177" r="5" fill="#c4f58e"/><path d="M345 1177 H845" fill="none" stroke="#c4f58e" stroke-width="3"/><circle cx="848" cy="1177" r="5" fill="#c4f58e"/><text x="868" y="1183" class="ink">1 · Ventole</text><text x="78" y="1226" class="pin">D2</text><circle cx="340" cy="1220" r="5" fill="#c4f58e"/><path d="M345 1220 H845" fill="none" stroke="#c4f58e" stroke-width="3"/><circle cx="848" cy="1220" r="5" fill="#c4f58e"/><text x="868" y="1226" class="ink">2 · Pompa</text><text x="78" y="1269" class="pin">D5</text><circle cx="340" cy="1263" r="5" fill="#c4f58e"/><path d="M345 1263 H845" fill="none" stroke="#c4f58e" stroke-width="3"/><circle cx="848" cy="1263" r="5" fill="#c4f58e"/><text x="868" y="1269" class="ink">3 · Richiesta coil</text><text x="78" y="1312" class="pin">D6</text><circle cx="340" cy="1306" r="5" fill="#c4f58e"/><path d="M345 1306 H845" fill="none" stroke="#c4f58e" stroke-width="3"/><circle cx="848" cy="1306" r="5" fill="#c4f58e"/><text x="868" y="1312" class="ink">4 · Valvola sopra</text><text x="78" y="1355" class="pin">D7</text><circle cx="340" cy="1349" r="5" fill="#c4f58e"/><path d="M345 1349 H845" fill="none" stroke="#c4f58e" stroke-width="3"/><circle cx="848" cy="1349" r="5" fill="#c4f58e"/><text x="868" y="1355" class="ink">5 · Valvola sotto</text><text x="78" y="1398" class="pin">D8</text><circle cx="340" cy="1392" r="5" fill="#c4f58e"/><path d="M345 1392 H845" fill="none" stroke="#c4f58e" stroke-width="3"/><circle cx="848" cy="1392" r="5" fill="#c4f58e"/><text x="868" y="1398" class="ink">6 · Compressore</text><text x="78" y="1441" class="pin">D0</text><circle cx="340" cy="1435" r="5" fill="#c4f58e"/><path d="M345 1435 H845" fill="none" stroke="#c4f58e" stroke-width="3"/><circle cx="848" cy="1435" r="5" fill="#c4f58e"/><text x="868" y="1441" class="ink">7 · LED</text><text x="78" y="1484" class="pin">G</text><circle cx="340" cy="1478" r="5" fill="#88b5ed"/><path d="M345 1478 H845" fill="none" stroke="#88b5ed" stroke-width="3"/><circle cx="848" cy="1478" r="5" fill="#88b5ed"/><text x="868" y="1484" class="ink">8 · GND segnali*</text><text x="78" y="1527" class="pin">5V</text><circle cx="340" cy="1521" r="5" fill="#f2bb75"/><path d="M345 1521 H845" fill="none" stroke="#f2bb75" stroke-width="3"/><circle cx="848" cy="1521" r="5" fill="#f2bb75"/><text x="868" y="1527" class="ink">9 · 5 V ingresso*</text><text x="78" y="1570" class="pin">G</text><circle cx="340" cy="1564" r="5" fill="#88b5ed"/><path d="M345 1564 H845" fill="none" stroke="#88b5ed" stroke-width="3"/><circle cx="848" cy="1564" r="5" fill="#88b5ed"/><text x="868" y="1570" class="ink">10 · GND alimentazione*</text><rect x="55" y="1640" width="1090" height="100" rx="12" class="card"/>
<text x="75" y="1670" class="small">11 e 12: liberi. I due fili GND partono dallo stesso pin G solo se questa distribuzione è adatta.</text>
<text x="75" y="1694" class="small">*5 V e GND: definire alimentazione e masse con i moduli reali; verificare anche l'uso contemporaneo di USB.</text>
<text x="75" y="1718" class="warn">Non collegare i carichi direttamente ai pin; i collegamenti dei driver e le protezioni sono da verificare.</text></svg>
