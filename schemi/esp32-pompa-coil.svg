<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1320" role="img" aria-labelledby="title desc"><title id="title">ESP32, pompa aria e coil: collegamenti preliminari</title><desc id="desc">Mappa di principio dei collegamenti tra ESP32, modulo XY-MOS, pompa e driver dedicato della coil. Tensioni, protezioni, polarità e comando a 3,3 volt devono essere confermati prima del collegamento.</desc><defs><style>
text{font-family:Arial,Helvetica,sans-serif}.head{fill:#fff;font-size:32px;font-weight:700}.sub{fill:#c4d2df;font-size:18px}.tag{fill:#a6d1ff;font-size:15px;font-weight:700;letter-spacing:2px}.box{fill:#1b3448;stroke:#6999b8;stroke-width:2}.mos{fill:#263e54;stroke:#80aecd;stroke-width:2}.heat{fill:#443329;stroke:#d3a76b;stroke-width:2}.load{fill:#263843;stroke:#7e9eaa;stroke-width:2}.h{fill:#f6f9fc;font-size:21px;font-weight:700}.t{fill:#cddbe6;font-size:17px}.small{fill:#bfcfdb;font-size:15px}.white{fill:#fff;font-size:18px;font-weight:700}.warn{fill:#ffdda9;font-size:17px;font-weight:700}.signal{fill:none;stroke:#8bc9ff;stroke-width:4}.power{fill:none;stroke:#f4bc75;stroke-width:4}.return{fill:none;stroke:#8daed4;stroke-width:4}.protect{fill:none;stroke:#ffb197;stroke-width:3;stroke-dasharray:8 7}.ghost{stroke-dasharray:9 6}.node{fill:#e9f4ff}
</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>
<rect width="1500" height="1320" rx="20" fill="#101925"/><text x="48" y="49" class="tag">SIB / SISTEMA FUMO</text><text x="48" y="93" class="head">ESP32, pompa e coil</text><text x="48" y="125" class="sub">Bozza funzionale: il compressore delle valvole è un circuito separato.</text>
<rect x="48" y="150" width="1404" height="76" rx="12" class="heat"/><text x="68" y="181" class="warn">NON ALIMENTARE: tensione e corrente di pompa e coil sono ancora sconosciute.</text><text x="68" y="208" class="small">Schema da verificare sui componenti reali. Il firmware attuale è solo in simulazione.</text>
<text x="48" y="270" class="tag">1 / POMPA ARIA · COLLEGAMENTO INDICATIVO</text>
<rect x="48" y="295" width="280" height="215" rx="16" class="box"/><text x="68" y="335" class="h">ESP32-WROOM</text><text x="68" y="363" class="small">Segnali a 3,3 V</text><text x="68" y="419" class="white">GPIO 26</text><text x="68" y="477" class="white">GND</text><circle cx="328" cy="412" r="6" class="node"/><circle cx="328" cy="470" r="6" class="node"/>
<rect x="530" y="295" width="400" height="300" rx="16" class="mos"/><text x="550" y="334" class="h">MODULO BLU XY-MOS</text><text x="550" y="362" class="small">Un modulo dedicato alla pompa</text><text x="550" y="419" class="white">TRIG / PWM</text><text x="550" y="477" class="white">GND</text><text x="550" y="529" class="white">VIN+</text><text x="750" y="529" class="white">VIN−</text><text x="750" y="419" class="white">OUT+</text><text x="750" y="477" class="white">OUT−</text><circle cx="530" cy="412" r="6" class="node"/><circle cx="530" cy="470" r="6" class="node"/><circle cx="620" cy="595" r="6" class="node"/><circle cx="820" cy="595" r="6" class="node"/><circle cx="930" cy="412" r="6" class="node"/><circle cx="930" cy="470" r="6" class="node"/>
<rect x="1080" y="295" width="372" height="215" rx="16" class="load"/><text x="1100" y="335" class="h">POMPA ARIA</text><text x="1100" y="363" class="small">Tensione e corrente da identificare</text><text x="1100" y="419" class="white">+</text><text x="1100" y="477" class="white">−</text><circle cx="1080" cy="412" r="6" class="node"/><circle cx="1080" cy="470" r="6" class="node"/>
<path class="signal ghost" d="M328 412H530"/><path class="return ghost" d="M328 470H530"/><path class="power ghost" d="M930 412H1080"/><path class="return ghost" d="M930 470H1080"/>
<rect x="505" y="655" width="450" height="125" rx="14" class="heat"/><text x="525" y="694" class="h">ALIMENTATORE POMPA DC</text><text x="525" y="725" class="t">Tensione, corrente e protezioni: da scegliere</text><text x="525" y="757" class="white">+ uscita</text><text x="760" y="757" class="white">− uscita</text>
<path class="power ghost" d="M620 655V595"/><path class="return ghost" d="M820 655V595"/>
<text x="48" y="827" class="small">Linee tratteggiate = collegamenti previsti da confermare sul modello reale. GND comune solo se richiesto dal modulo.</text><text x="48" y="852" class="small">Verificare pilotaggio a 3,3 V e soppressione dei transitori del motore. Nessun collegamento alla rete 230 V qui.</text>
<text x="48" y="905" class="tag">2 / COIL · IL DRIVER E LA POTENZA SONO DA DEFINIRE</text>
<rect x="48" y="935" width="280" height="110" rx="14" class="box"/><text x="68" y="972" class="h">ESP32 · GPIO 27</text><text x="68" y="1002" class="small">Solo richiesta ON/OFF</text>
<rect x="430" y="935" width="430" height="110" rx="14" class="heat"/><text x="450" y="972" class="h">DRIVER COIL DEDICATO</text><text x="450" y="1002" class="small">Tensione e corrente da definire</text>
<rect x="980" y="935" width="472" height="110" rx="14" class="load"/><text x="1000" y="972" class="h">COIL / ATOMIZZATORE</text><text x="1000" y="1002" class="small">Resistenza e potenza ignote</text>
<path class="signal ghost" marker-end="url(#arrow)" d="M328 990H420"/><path class="power ghost" marker-end="url(#arrow)" d="M860 990H970"/>
<rect x="48" y="1080" width="280" height="92" rx="14" class="heat"/><text x="68" y="1115" class="h">ALIMENTATORE COIL</text><text x="68" y="1144" class="small">Tensione e corrente da definire</text><path class="power ghost" marker-end="url(#arrow)" d="M328 1126H370V1020H420"/><rect x="430" y="1080" width="1022" height="92" rx="14" class="heat"/><text x="450" y="1116" class="h">CONSENSI HARDWARE INDIPENDENTI</text><text x="450" y="1145" class="t">Flusso aria verificato + protezione termica + arresto fisico: interrompono la potenza termica.</text>
<path class="protect" marker-end="url(#arrow)" d="M645 1080V1055"/>
<text x="48" y="1220" class="sub">Sequenza prevista: pompa prima della coil → coil OFF → spurgo pompa di circa 3 s.</text><text x="48" y="1248" class="small">Il timer di 40 s non rileva il funzionamento a secco. Driver, fusibili e alimentatori vanno dimensionati.</text><text x="48" y="1277" class="small">La pompa deve essere adatta all'aspirazione di aerosol, temperatura e condensa.</text>
</svg>
